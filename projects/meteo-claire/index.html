<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf5ff"><title>Météo Claire — Prévisions</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf5ff;color:#15304b;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:22px;letter-spacing:-1px}.logo span{color:#3889db}.badge{font-size:12px;background:#d6eaff;padding:8px 12px;border-radius:20px}.search{display:flex;gap:10px;margin:34px 0 20px}.search input{flex:1;min-width:0;padding:15px 18px;border:1px solid #c5ddf4;border-radius:14px;background:white;font:inherit;outline-color:#3889db}.search button{border:0;border-radius:14px;padding:0 20px;background:#236fc0;color:white;font-weight:800;cursor:pointer}.current{background:linear-gradient(135deg,#3c94df,#8bc9f5);color:#fff;border-radius:28px;padding:30px;display:grid;grid-template-columns:1fr auto;gap:15px;box-shadow:0 15px 35px #4d9bd42b}.place{font-size:14px;opacity:.9}.temp{font-size:clamp(58px,10vw,88px);font-weight:800;letter-spacing:-5px;line-height:1.1}.desc{font-size:18px}.weather-icon{font-size:82px;align-self:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#ffffffa8;border-radius:16px;padding:16px}.stat small{color:#5b7791}.stat strong{display:block;font-size:22px;margin-top:4px}.section h2{margin-top:35px}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.day{background:white;border:1px solid #d9eaf9;border-radius:16px;text-align:center;padding:18px 8px}.day span{display:block}.day .icon{font-size:28px;margin:10px 0}.day small{color:#66809a}.note{font-size:12px;color:#66809a;margin-top:24px}.error{color:#a32626;min-height:24px}@media(max-width:600px){.wrap{padding:16px}.current{padding:22px}.weather-icon{font-size:60px}.stats{grid-template-columns:1fr}.forecast{grid-template-columns:repeat(2,1fr)}.search button{padding:0 12px}.temp{letter-spacing:-3px}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">météo<span>claire.</span></div><div class="badge">Démo interactive</div></header><form class="search" id="search"><input id="city" placeholder="Rechercher une ville…" value="Fort-de-France" aria-label="Nom de la ville"><button type="submit">Rechercher</button></form><p class="error" id="error" aria-live="polite"></p><main><section class="current"><div><div class="place" id="place">FORT-DE-FRANCE · AUJOURD’HUI</div><div class="temp" id="temp">29°</div><div class="desc" id="desc">Ensoleillé avec quelques nuages</div><p>Ressenti <strong id="feel">32°</strong></p></div><div class="weather-icon" id="icon">☀️</div></section><section class="stats"><div class="stat"><small>Humidité</small><strong id="humidity">72 %</strong></div><div class="stat"><small>Vent</small><strong id="wind">18 km/h</strong></div><div class="stat"><small>Indice UV</small><strong id="uv">Élevé</strong></div></section><section class="section"><h2>Prévisions sur 5 jours</h2><div class="forecast" id="forecast"></div></section></main><p class="note">Les valeurs affichées sont des données fictives de démonstration, pas des prévisions météo en temps réel.</p></div><script>const data={'fort-de-france':{temp:29,desc:'Ensoleillé avec quelques nuages',icon:'☀️',feel:32,humidity:72,wind:18,uv:'Élevé'},'paris':{temp:17,desc:'Nuageux',icon:'☁️',feel:16,humidity:64,wind:12,uv:'Modéré'},'lyon':{temp:19,desc:'Éclaircies',icon:'🌤️',feel:19,humidity:58,wind:9,uv:'Modéré'},'marseille':{temp:24,desc:'Ensoleillé',icon:'☀️',feel:25,humidity:49,wind:15,uv:'Élevé'},'london':{temp:15,desc:'Petite pluie',icon:'🌦️',feel:13,humidity:81,wind:21,uv:'Faible'}};const days=['Aujourd’hui','Demain','Sam.','Dim.','Lun.'];function render(city){const key=city.trim().toLocaleLowerCase('fr');const d=data[key];if(!d){document.querySelector('#error').textContent='Ville de démo inconnue. Essayez Fort-de-France, Paris, Lyon, Marseille ou London.';return}document.querySelector('#error').textContent='';document.querySelector('#place').textContent=city.toLocaleUpperCase('fr')+' · AUJOURD’HUI';for(const [id,val] of Object.entries({temp:d.temp+'°',desc:d.desc,icon:d.icon,feel:d.feel+'°',humidity:d.humidity+' %',wind:d.wind+' km/h',uv:d.uv}))document.querySelector('#'+id).textContent=val;document.querySelector('#forecast').innerHTML=days.map((day,i)=>'<div class="day"><small>'+day+'</small><span class="icon">'+[d.icon,'🌤️','☁️','🌦️','☀️'][i]+'</span><span><strong>'+(d.temp+([0,1,-2,-1,2][i]))+'°</strong></span><small>'+(d.temp-([4,3,5,4,3][i]))+'°</small></div>').join('')}document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();render(document.querySelector('#city').value)});render('Fort-de-France');</script></body></html>
